{% extends 'base.html' %}

{% block content %}
<div class="flex-center" style="min-height: 75vh;">
    <div class="card" style="text-align: center; max-width: 520px; border: 1px solid #000; padding: 2.5rem 2rem;">
        <img src="{{ url_for('static', filename='images/mit_logo.png') }}" alt="MIT Mysore Logo" style="width: 80px; height: 80px; object-fit: contain; margin: 0 auto 1.25rem; display: block;">
        <h1 style="margin-bottom: 0.5rem; color: #000; font-size: 1.4rem; text-transform: uppercase; font-weight: 700;">MIT Mysore Placement Portal</h1>
        <p style="margin-bottom: 2rem; color: #666; font-size: 0.9rem;">Maharaja Institute of Technology Mysore &bull; Placement Management System</p>
        <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
            <a href="{{ url_for('admin_login') }}" class="btn" style="background: #000; color: #fff; border: 1px solid #000; padding: 0.65rem 1.5rem;">Placement Admin Login</a>
            <a href="{{ url_for('student_login') }}" class="btn btn-secondary" style="border: 1px solid #000; color: #000; background: #fff; padding: 0.65rem 1.5rem;">Student Portal</a>
        </div>
    </div>
</div>
{% endblock %}
